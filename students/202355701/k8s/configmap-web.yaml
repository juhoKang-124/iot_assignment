      <section aria-label="설정">
        <details>
          <summary>현재 적용된 시뮬레이션 설정 (params.json)</summary>
          <p class="src" id="paramSrc">불러오는 중…</p>
          <pre id="paramJson"></pre>
        </details>
      </section>

      <footer>
        <p>참고 논문: 류영우, 김정구, “소수 불균형 데이터의 심층학습을 통한 능동소나 다층처리기의 표적 인식성 개선,” 한국음향학회지 43(2), 225–233 (2024). <a href="https://doi.org/10.7776/ASK.2024.43.2.225">doi:10.7776/ASK.2024.43.2.225</a></p>
        <p>이 페이지는 논문의 처리 구조를 이해하기 위한 교육용 시연이며, 모든 데이터는 브라우저에서 무작위로 생성한 합성 데이터입니다. 실제 소나 데이터나 학습된 모델은 사용하지 않습니다.</p>
        <p>지능형IoT플랫폼 컨테이너 실습 과제 · 202355701 · OpenShift Developer Sandbox 배포</p>
      </footer>
    </div>

    <script>
    (() => {
      'use strict';

      // params.json을 불러오지 못했을 때 사용하는 기본값
      const DEFAULTS = {
        display: { bearingCells: 128, rangeCells: 300, maxRangeKm: 10 },
        detection: { thresholdDb: 6, peakMean: 2000, peakStd: 150, noiseSnrScaleDb: 3.2, persistentClutter: 3 },
        target: { startBearing: 72, startRangeKm: 5.0, bearingRatePerPing: 0.12, rangeRateKmPerPing: -0.005, snrMeanDb: 33, snrStdDb: 5 },
        classifier: { enabled: true, targetMisclassRate: 0.059, nonTargetRemainRate: 0.052 },
        tracker: { initConfidence: 0.5, confidenceStep: 0.4, confirmHits: 2, gateBearingCells: 3, gateRangeKm: 0.15 },
        simulation: { maxPings: 220, pingIntervalMs: 700, seed: 2024 }
      };

      function merge(base, over) {
        const out = { ...base };
        for (const k in over) {
          const v = over[k];
          if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object') out[k] = merge(base[k], v);
          else out[k] = v;
        }
        return out;
      }

      // 재현 가능한 난수 (같은 seed면 같은 결과)
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function gauss(r) {
        let u = 0, v = 0;
        while (u === 0) u = r();
        while (v === 0) v = r();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }
      const mod = (x, n) => ((x % n) + n) % n;
      function bearingDiff(d, n) { d = mod(d, n); return d > n / 2 ? d - n : d; }
      const clamp01 = v => Math.max(0, Math.min(1, v));
      const ease = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);

      // 축별 등속도 칼만 필터 (상태: 위치, 변화율)
      class AxisKF {
        constructor(z, measVar, rateVar, q) {
          this.x = [z, 0];
          this.P = [[measVar, 0], [0, rateVar]];
          this.R = measVar; this.q = q;
        }
        predict() {
          const [p, v] = this.x, P = this.P, q = this.q;
          this.x = [p + v, v];
          this.P = [
            [P[0][0] + P[0][1] + P[1][0] + P[1][1] + q * 0.25, P[0][1] + P[1][1] + q * 0.5],
            [P[1][0] + P[1][1] + q * 0.5, P[1][1] + q]
          ];
        }
        update(innov) {
          const P = this.P, S = P[0][0] + this.R, k0 = P[0][0] / S, k1 = P[1][0] / S;
          this.x = [this.x[0] + k0 * innov, this.x[1] + k1 * innov];
          this.P = [
            [(1 - k0) * P[0][0], (1 - k0) * P[0][1]],
            [P[1][0] - k1 * P[0][0], P[1][1] - k1 * P[0][1]]
          ];
        }
      }

      // 최근접 연계 + 신뢰도 기반 궤적 관리
      class Tracker {
        constructor(p, nBearing) { this.p = p; this.n = nBearing; this.tracks = []; this.nextId = 1; }
        step(meas) {
          const p = this.p, n = this.n, tr = this.tracks;
          for (const t of tr) { t.kb.predict(); t.kr.predict(); t.kb.x[0] = mod(t.kb.x[0], n); }

          const pairs = [];
          for (let i = 0; i < tr.length; i++) {
            const t = tr[i];
            for (let j = 0; j < meas.length; j++) {
              const m = meas[j];
              const db = bearingDiff(m.b - t.kb.x[0], n) / p.gateBearingCells;
              if (Math.abs(db) > 1) continue;
              const dr = (m.r - t.kr.x[0]) / p.gateRangeKm;
              if (Math.abs(dr) > 1) continue;
              const d = db * db + dr * dr;
              if (d <= 1) pairs.push([d, i, j]);
            }
          }
          pairs.sort((a, b) => a[0] - b[0]);
          const tUsed = new Uint8Array(tr.length), mUsed = new Uint8Array(meas.length);
          for (const [, i, j] of pairs) {
            if (tUsed[i] || mUsed[j]) continue;
            tUsed[i] = 1; mUsed[j] = 1;
            const t = tr[i], m = meas[j];
            t.kb.update(bearingDiff(m.b - t.kb.x[0], n));
            t.kb.x[0] = mod(t.kb.x[0], n);
            t.kr.update(m.r - t.kr.x[0]);
            t.conf = Math.min(1, t.conf + p.confidenceStep);
            t.hits++;
            if (m.isTarget) t.targetHits++;
          }

          const next = [];
          for (let i = 0; i < tr.length; i++) {
            const t = tr[i];
            if (!tUsed[i]) t.conf = Math.max(0, t.conf - p.confidenceStep);
            t.hist.push([t.kb.x[0], t.kr.x[0]]);
            if (t.hist.length > 25) t.hist.shift();
            if (t.conf > 1e-6) next.push(t);
          }
          for (let j = 0; j < meas.length; j++) {
            if (mUsed[j]) continue;
            const m = meas[j];
            next.push({
              id: this.nextId++,
              kb: new AxisKF(m.b, 0.25, 0.25, 0.01),
              kr: new AxisKF(m.r, 0.03 * 0.03, 0.02 * 0.02, 1e-5),
              conf: p.initConfidence, hits: 1, targetHits: m.isTarget ? 1 : 0,
              hist: [[m.b, m.r]]
            });
          }
          this.tracks = next;
        }
        confirmed() { return this.tracks.filter(t => t.hits >= this.p.confirmHits); }
      }
      const isTargetTrack = t => t.targetHits / t.hits >= 0.5;

      // ---------- 상태 ----------
      let P, BASE, rng, S, timer = null, playing = true;
      let SEL = null; // 클릭으로 선택한 탐지 { m, live }
      const el = id => document.getElementById(id);
      const fmt = n => Math.round(n).toLocaleString('ko-KR');
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // 애니메이션 상태: t0 시작 시각, dur 길이(ms), final 마지막 프레임을 그렸는지
      let anim = { t0: 0, dur: 0, final: false };

      function reset() {
        const D = P.display, d = P.detection, tg = P.target;
        rng = mulberry32(P.simulation.seed);
        S = {
          ping: 0,
          tb: tg.startBearing, tr: tg.startRangeKm,
          streaks: [0, 1, 2, 3].map(() => rng() * D.bearingCells),
          persist: Array.from({ length: d.persistentClutter }, () => ({ b: rng() * D.bearingCells, r: 0.5 + rng() * (D.maxRangeKm - 1) })),
          trkC: new Tracker(P.tracker, D.bearingCells),
          trkN: new Tracker(P.tracker, D.bearingCells),
          hist: [], frame: null, prevFrame: null,
          totTarget: 0, misTarget: 0, totNon: 0, remNon: 0
        };
        fieldCur = null; fieldPrev = null;
        if (SEL) SEL.live = false;
        anim = { t0: performance.now(), dur: 0, final: false };
        el('pingMax').textContent = P.simulation.maxPings;
        updateStats();
      }

      // 한 핑 분량의 합성 탐지 데이터 생성
      function generatePing() {
        const D = P.display, d = P.detection, tg = P.target, n = D.bearingCells, R = D.maxRangeKm;
        S.tb = mod(S.tb + tg.bearingRatePerPing, n);
        S.tr = Math.min(R - 0.3, Math.max(0.3, S.tr + tg.rangeRateKmPerPing));

        const nPeaks = Math.max(0, Math.round(d.peakMean + d.peakStd * gauss(rng)));
        const dets = [];
        for (let i = 0; i < nPeaks; i++) {
          // 잡음 첨두치의 SNR은 지수분포 → 문턱값을 넘는 일부만 탐지로 남음
          const snr = -Math.log(1 - rng()) * d.noiseSnrScaleDb;
          if (snr < d.thresholdDb) continue;
          const b = rng() < 0.2 ? S.streaks[Math.floor(rng() * S.streaks.length)] + gauss(rng) * 0.6 : rng() * n;
          dets.push({ b: mod(b, n), r: 0.2 + rng() * (R - 0.2), snr, isTarget: false });
        }
        // 같은 위치에서 반복되는 해저 잔향 (지속성 클러터)
        for (const pc of S.persist) {
          if (rng() < 0.6) dets.push({ b: mod(pc.b + gauss(rng) * 0.3, n), r: pc.r + gauss(rng) * 0.01, snr: d.thresholdDb + 2 + rng() * 6, isTarget: false });
        }
        // 실제 표적 1개
        const tsnr = tg.snrMeanDb + tg.snrStdDb * gauss(rng);
        if (tsnr >= d.thresholdDb) dets.push({ b: mod(S.tb + gauss(rng) * 0.4, n), r: S.tr + gauss(rng) * 0.02, snr: tsnr, isTarget: true });
        return { nPeaks, dets };
      }

      function step(manual) {
        if (S.ping >= P.simulation.maxPings) { stop(true); return; }
        S.ping++;
        const { nPeaks, dets } = generatePing();

        const c = P.classifier;
        const kept = c.enabled
          ? dets.filter(m => rng() < (m.isTarget ? 1 - c.targetMisclassRate : c.nonTargetRemainRate))
          : dets.slice();
        const keptSet = new Set(kept);
        for (const m of dets) {
          m.kept = keptSet.has(m);
          if (m.isTarget) { S.totTarget++; if (!m.kept) S.misTarget++; }
          else { S.totNon++; if (m.kept) S.remNon++; }
        }

        // 애니메이션용: 갱신 전 확정 궤적 위치 기억
        const prevTracks = new Map(S.trkC.confirmed().map(t => [t.id, {
          b: t.kb.x[0], r: t.kr.x[0], isT: isTargetTrack(t), hist: t.hist.slice()
        }]));
        const prevTracksN = new Map(S.trkN.confirmed().map(t => [t.id, {
          b: t.kb.x[0], r: t.kr.x[0], isT: isTargetTrack(t), hist: t.hist.slice()
        }]));
        const prevTruth = S.frame ? S.frame.truth : null;

        S.trkC.step(kept);
        S.trkN.step(dets);
        const confC = S.trkC.confirmed(), confN = S.trkN.confirmed();

        const prevCounts = S.hist.length ? S.hist[S.hist.length - 1] : { det: 0, clf: 0, trkC: 0, trkN: 0 };
        if (SEL && SEL.live) SEL.live = false; // 선택했던 탐지는 이전 핑의 것이 됨
        S.hist.push({ peaks: nPeaks, det: dets.length, clf: kept.length, trkC: confC.length, trkN: confN.length, thr: P.detection.thresholdDb });
        S.prevFrame = S.frame;
        S.frame = { dets, kept, confC, confN, nPeaks, prevTracks, prevTracksN, prevCounts, truth: { b: S.tb, r: S.tr }, prevTruth };

        fieldPrev = fieldCur;
        fieldCur = renderField(dets);
        [offPrev, offCur] = [offCur, offPrev];
        colorize(fieldCur, offCur);

        const dur = reduced ? 0 : (manual ? 700 : Math.min(900, interval() * 0.8));
        anim = { t0: performance.now(), dur, final: false };
        updateStats();
        if (S.ping >= P.simulation.maxPings) stop(true);
      }

      // ---------- 화면 데이터 ----------
      let offCur = document.createElement('canvas'), offPrev = document.createElement('canvas');
      let fieldCur = null, fieldPrev = null;
      const cvs = [el('cv1'), el('cv2'), el('cv3'), el('cv4'), el('cv5')];
      const LW = 384, LH = 360;
      const dpr = Math.max(2, Math.min(3, window.devicePixelRatio || 1));
      for (const c of cvs) { c.width = LW * dpr; c.height = LH * dpr; }
      const chart = el('chart'); const CW = 720, CH = 260;
      chart.width = CW * dpr; chart.height = CH * dpr;

      // 테마별 에너지 화면 색상표
      const MAPS = {
        light: [[0, [250, 252, 255]], [0.3, [223, 235, 249]], [0.55, [150, 190, 236]], [0.75, [68, 118, 204]], [1, [22, 42, 128]]],
        dark: [[0, [8, 16, 60]], [0.35, [20, 50, 170]], [0.6, [30, 150, 220]], [0.8, [90, 220, 200]], [1, [250, 230, 80]]]
      };
      let COL = {};
      function readColors() {
        const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue(k).trim();
        COL = {
          det: g('--det'), clf: g('--clf'), trk: g('--trk'), ntrk: g('--ntrk'), truth: g('--truth'),
          grid: g('--grid'), gridText: g('--grid-text'), scopeBg: g('--scope-bg'), sweep: g('--sweep'),
          muted: g('--muted'), line: g('--line'), accent: g('--accent'),
          map: MAPS[document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light']
        };
      }
      function cmap(v) {
        const stops = COL.map;
        v = clamp01(v);
        for (let i = 1; i < stops.length; i++) {
          if (v <= stops[i][0]) {
            const [a, ca] = stops[i - 1], [b, cb] = stops[i], t = (v - a) / (b - a);
            return [ca[0] + (cb[0] - ca[0]) * t, ca[1] + (cb[1] - ca[1]) * t, ca[2] + (cb[2] - ca[2]) * t];
          }
        }
        return stops[stops.length - 1][1];
      }

      // 방위-거리 에너지 분포 (잡음 + 잔향 + 탐지 반향)
      function renderField(dets) {
        const D = P.display, n = D.bearingCells, RC = D.rangeCells, R = D.maxRangeKm;
        const vr = mulberry32(P.simulation.seed * 7919 + S.ping);
        const f = new Float32Array(n * RC);
        for (let y = 0; y < RC; y++) {
          const near = 0.14 * Math.exp(-(y / RC) * R / 1.2);
          for (let x = 0; x < n; x++) f[y * n + x] = 0.12 + 0.1 * vr() + near;
        }
        for (const sb of S.streaks) {
          const x = Math.round(mod(sb, n)) % n;
          for (let y = 0; y < RC; y++) f[y * n + x] += 0.08 * vr();
        }
        for (const m of dets) {
          const cx = m.b, cy = m.r / R * RC;
          const amp = 0.3 + 0.6 * Math.min(1, (m.snr - 6) / 30);
          const sb = m.isTarget ? 1.5 : 0.5 + vr() * 0.7, sr = m.isTarget ? 2.2 : 0.5 + vr() * 1.0;
          for (let dy = -Math.ceil(3 * sr); dy <= Math.ceil(3 * sr); dy++) {
            const y = Math.round(cy) + dy; if (y < 0 || y >= RC) continue;
            for (let dx = -Math.ceil(3 * sb); dx <= Math.ceil(3 * sb); dx++) {
              const x = mod(Math.round(cx) + dx, n);
              const ex = (Math.round(cx) + dx - cx) / sb, ey = (y - cy) / sr;
              f[y * n + x] += amp * Math.exp(-0.5 * (ex * ex + ey * ey));
            }
          }
        }
        return f;
      }
      function colorize(f, canvas) {
        if (!f) return;
        const n = P.display.bearingCells, RC = P.display.rangeCells;
        canvas.width = n; canvas.height = RC;
        const ctx = canvas.getContext('2d'), img = ctx.createImageData(n, RC);
        for (let i = 0; i < f.length; i++) {
          const [r, g, b] = cmap(f[i]);
          img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }

      // ---------- 그리기 ----------
      function prep(c) {
        const ctx = c.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        return ctx;
      }

      // 배경: 이전 핑 화면 위로 새 핑 화면이 sweep 선을 따라 드러남
      function drawScope(ctx, p) {
        ctx.fillStyle = COL.scopeBg; ctx.fillRect(0, 0, LW, LH);
        ctx.imageSmoothingEnabled = true;
        const RC = P.display.rangeCells;
        if (fieldPrev && p < 1) ctx.drawImage(offPrev, 0, 0, LW, LH);
        if (fieldCur) {
          const h = Math.min(RC, RC * p);
          if (h >= 1) ctx.drawImage(offCur, 0, 0, offCur.width, h, 0, 0, LW, LH * h / RC);
        }
        const D = P.display, sx = LW / D.bearingCells, sy = LH / D.maxRangeKm;
        ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
        ctx.fillStyle = COL.gridText; ctx.font = '10px system-ui, sans-serif';
        for (let km = 2; km < D.maxRangeKm; km += 2) {
          ctx.beginPath(); ctx.moveTo(0, km * sy + 0.5); ctx.lineTo(LW, km * sy + 0.5); ctx.stroke();
          ctx.fillText(km + 'km', 3, km * sy - 3);
        }
        for (let b = 32; b < D.bearingCells; b += 32) {
          ctx.beginPath(); ctx.moveTo(b * sx + 0.5, 0); ctx.lineTo(b * sx + 0.5, LH); ctx.stroke();
          ctx.fillText(String(b), b * sx + 3, LH - 4);
        }
        return { sx, sy };
      }

      function drawSweep(ctx, y) {
        const g = ctx.createLinearGradient(0, y - 28, 0, y);
        g.addColorStop(0, `rgba(${COL.sweep},0)`);
        g.addColorStop(1, `rgba(${COL.sweep},0.30)`);
        ctx.fillStyle = g; ctx.fillRect(0, y - 28, LW, 28);
        ctx.strokeStyle = `rgba(${COL.sweep},0.95)`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LW, y); ctx.stroke();
      }

      function cross(ctx, x, y, s) {
        ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x + s, y); ctx.moveTo(x, y - s); ctx.lineTo(x, y + s); ctx.stroke();
      }
      function xmark(ctx, x, y, s) {
        ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
      }

      function drawTruth(ctx, sx, sy, e) {
        if (!el('showTruth').checked || !S.frame) return;
        const cur = S.frame.truth, pr = S.frame.prevTruth || cur, n = P.display.bearingCells;
        const b = mod(pr.b + bearingDiff(cur.b - pr.b, n) * e, n), r = pr.r + (cur.r - pr.r) * e;
        const x = b * sx, y = r * sy;
        ctx.save();
        ctx.strokeStyle = COL.truth; ctx.lineWidth = 1.5; ctx.setLineDash([3, 2]);
        ctx.strokeRect(x - 8, y - 8, 16, 16);
        ctx.setLineDash([]);
        ctx.fillStyle = COL.truth; ctx.font = '600 11px system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('Target', x - 12, y + 4);
        ctx.restore();
      }

      // simple: 궤적이 아주 많을 때(분류기 미적용) 꼬리 그라데이션과 이름표를 생략해 가볍게 그림
      function drawTrack(ctx, sx, sy, hist, b, r, isT, alpha, id, now, simple) {
        if (alpha <= 0.01) return;
        const col = isT ? COL.trk : COL.ntrk, n = P.display.bearingCells;
        const pts = hist.concat([[b, r]]);
        ctx.save();
        ctx.strokeStyle = col; ctx.lineWidth = simple ? 1 : 1.6; ctx.lineCap = 'round';
        if (simple) {
          ctx.globalAlpha = alpha * 0.45;
          ctx.beginPath();
          for (let k = 0; k < pts.length; k++) {
            const [b1, r1] = pts[k];
            if (k === 0 || Math.abs(b1 - pts[k - 1][0]) > n / 2) ctx.moveTo(b1 * sx, r1 * sy); else ctx.lineTo(b1 * sx, r1 * sy);
          }
          ctx.stroke();
          ctx.globalAlpha = alpha;
          const x = b * sx, y = r * sy;
          ctx.lineWidth = isT ? 2 : 1.2;
          ctx.strokeRect(x - (isT ? 6 : 3.5), y - (isT ? 6 : 3.5), isT ? 12 : 7, isT ? 12 : 7);
          ctx.restore();
          return;
        }
        for (let k = 1; k < pts.length; k++) {
          const [b0, r0] = pts[k - 1], [b1, r1] = pts[k];
          if (Math.abs(b1 - b0) > n / 2) continue;
          ctx.globalAlpha = alpha * (0.15 + 0.85 * k / (pts.length - 1));
          ctx.beginPath(); ctx.moveTo(b0 * sx, r0 * sy); ctx.lineTo(b1 * sx, r1 * sy); ctx.stroke();
        }
        const x = b * sx, y = r * sy;
        ctx.globalAlpha = alpha;
        // 표적 궤적 주변의 퍼지는 링
        if (isT && !reduced) {
          const ph = (now % 1400) / 1400;
          ctx.globalAlpha = alpha * (1 - ph) * 0.7;
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(x, y, 7 + 14 * ph, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha = alpha;
        }
        ctx.lineWidth = 2; ctx.strokeRect(x - 6, y - 6, 12, 12);
        ctx.fillStyle = col; ctx.font = '600 10px system-ui, sans-serif';
        ctx.fillText((isT ? 'target' : 'non-target') + ' #' + id, x + 9, y - 8);
        ctx.restore();
      }

      // 확정 궤적 목록을 이전 위치→새 위치로 보간하며 그림. 사라진 궤적은 서서히 지움
      function drawTracks(ctx, sx, sy, list, prevMap, e, now) {
        const n = P.display.bearingCells, ids = new Set(), simple = list.length > 40;
        for (const t of list) {
          ids.add(t.id);
          const pr = prevMap.get(t.id);
          let b = t.kb.x[0], r = t.kr.x[0], a = 1;
          if (pr) { b = mod(pr.b + bearingDiff(t.kb.x[0] - pr.b, n) * e, n); r = pr.r + (t.kr.x[0] - pr.r) * e; }
          else a = e;
          drawTrack(ctx, sx, sy, t.hist.slice(0, -1), b, r, isTargetTrack(t), a, t.id, now, simple);
        }
        if (e < 1) for (const [id, pr] of prevMap) {
          if (!ids.has(id)) drawTrack(ctx, sx, sy, pr.hist.slice(0, -1), pr.b, pr.r, pr.isT, 1 - e, id, now, simple);
        }
      }

      // 클릭으로 선택한 탐지 강조
      function drawSelection(ctx, sx, sy, now) {
        if (!SEL || !SEL.live) return;
        const m = SEL.m, x = m.b * sx, y = m.r * sy;
        ctx.save();
        ctx.strokeStyle = COL.accent || COL.truth; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.stroke();
        if (!reduced) {
          const ph = (now % 1200) / 1200;
          ctx.globalAlpha = 1 - ph;
          ctx.beginPath(); ctx.arc(x, y, 9 + 10 * ph, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }

      function render(now) {
        const p = anim.dur > 0 ? clamp01((now - anim.t0) / anim.dur) : 1;
        const e = ease(p);
        const sweepY = p < 1 ? p * LH : LH + 1;
        const F = S && S.frame, PF = S && S.prevFrame;

        // 처리 흐름 상자: sweep 진행에 맞춰 단계별로 강조
        const stage = !F || p >= 1 ? -1 : p < 0.18 ? 0 : p < 0.45 ? 1 : p < 0.75 ? 2 : 3;
        if (stage !== render.stage) {
          for (let i = 0; i < 4; i++) el('st' + i).classList.toggle('on', i === stage);
          for (let i = 1; i < 4; i++) el('ar' + i).classList.toggle('on', i === stage);
          render.stage = stage;
        }

        const showCmp = el('showCmp').checked;
        for (let k = 0; k < 5; k++) {
          if (k >= 3 && !showCmp) continue;
          const ctx = prep(cvs[k]);
          if (k === 3) {
            // 비교 화면 왼쪽은 ③ 추적 화면과 같으므로 그대로 복사
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.drawImage(cvs[2], 0, 0);
            continue;
          }
          if (!F) { ctx.fillStyle = COL.scopeBg; ctx.fillRect(0, 0, LW, LH); continue; }
          const { sx, sy } = drawScope(ctx, p);
          const shown = m => m.r * sy < sweepY;
          const age = m => now - (anim.t0 + (m.r * sy / LH) * anim.dur);

          if (k === 0) {
            // ① 탐지: 적색 십자 (논문 Fig. 3), 새로 드러난 탐지는 잠깐 크게
            ctx.strokeStyle = COL.det; ctx.lineWidth = 1.2;
            if (PF && p < 1) { ctx.globalAlpha = 0.3; for (const m of PF.dets) if (!shown(m)) cross(ctx, m.b * sx, m.r * sy, 3); }
            ctx.globalAlpha = 1;
            for (const m of F.dets) {
              if (!shown(m)) continue;
              const a = age(m), s = anim.dur && a < 180 ? 1 + 0.9 * (1 - a / 180) : 1;
              cross(ctx, m.b * sx, m.r * sy, 3 * s);
            }
          } else if (k === 1) {
            // ② 분류: 남은 탐지는 원, 제거되는 비표적은 잠깐 × 표시 후 사라짐
            const fade = Math.max(300, anim.dur * 0.6);
            ctx.lineWidth = 1.5;
            if (PF && p < 1) {
              ctx.strokeStyle = COL.clf; ctx.globalAlpha = 0.3;
              for (const m of PF.kept) if (!shown(m)) { ctx.beginPath(); ctx.arc(m.b * sx, m.r * sy, 4.5, 0, Math.PI * 2); ctx.stroke(); }
            }
            for (const m of F.dets) {
              if (!shown(m)) continue;
              const a = age(m);
              if (m.kept) {
                const s = anim.dur && a < 220 ? 1 + 1.2 * (1 - a / 220) : 1;
                ctx.globalAlpha = 1; ctx.strokeStyle = COL.clf;
                ctx.beginPath(); ctx.arc(m.b * sx, m.r * sy, 4.5 * s, 0, Math.PI * 2); ctx.stroke();
              } else if (anim.dur && a < fade) {
                ctx.globalAlpha = 0.75 * (1 - a / fade); ctx.strokeStyle = COL.det; ctx.lineWidth = 1.2;
                xmark(ctx, m.b * sx, m.r * sy, 2.5);
                ctx.lineWidth = 1.5;
              }
            }
            ctx.globalAlpha = 1;
          } else if (k === 2) {
            // ③ 추적: 궤적이 이전 위치에서 새 위치로 부드럽게 이동, 생성/삭제는 서서히
            drawTracks(ctx, sx, sy, F.confC, F.prevTracks, e, now);
          } else {
            // 비교: 분류기 없이 탐지를 바로 추적한 결과
            drawTracks(ctx, sx, sy, F.confN, F.prevTracksN, e, now);
          }
          if (k <= 1) drawSelection(ctx, sx, sy, now);
          if (p < 1) drawSweep(ctx, sweepY);
          drawTruth(ctx, sx, sy, e);
        }

        // 숫자와 차트는 애니메이션 중에만 다시 그림
        if (!anim.final) {
          const last = F ? S.hist[S.hist.length - 1] : null, pc = F ? F.prevCounts : null;
          const tw = k => (last ? pc[k] + (last[k] - pc[k]) * e : 0);
          el('cDet').innerHTML = fmt(tw('det')) + '<small>개</small>';
          el('cClf').innerHTML = fmt(tw('clf')) + '<small>개</small>';
          el('cTrk').innerHTML = fmt(tw('trkC')) + '<small>개 궤적</small>';
          el('cTrkN').textContent = fmt(tw('trkN'));
          el('cmpC').innerHTML = fmt(tw('trkC')) + '<small>개 궤적</small>';
          el('cmpN').innerHTML = fmt(tw('trkN')) + '<small>개 궤적</small>';
          drawChart(e);
          if (p >= 1) anim.final = true;
        }
        requestAnimationFrame(render);
      }

      function drawChart(e) {
        const ctx = prep(chart);
        ctx.clearRect(0, 0, CW, CH);
        const L = 44, Rp = 10, T = 10, B = 26, w = CW - L - Rp, h = CH - T - B;
        const maxP = P.simulation.maxPings, H = S.hist;
        const all = H.flatMap(o => [o.det, o.clf, o.trkC, o.trkN]);
        const top = Math.max(2, Math.ceil(Math.log10(Math.max(10, ...all) + 1)));
        const yOf = v => T + h - (Math.log10(v + 1) / top) * h;
        const xOf = i => L + (i / Math.max(1, maxP - 1)) * w;

        ctx.font = '11px system-ui, sans-serif'; ctx.fillStyle = COL.muted; ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
        for (let k = 0; k <= top; k++) {
          const v = k === 0 ? 0 : Math.pow(10, k), y = yOf(v);
          ctx.beginPath(); ctx.moveTo(L, y + 0.5); ctx.lineTo(L + w, y + 0.5); ctx.stroke();
          ctx.fillText(fmt(v), 4, y + 4);
        }
        for (let p = 0; p <= maxP; p += 50) ctx.fillText(String(p), xOf(Math.max(0, p - 1)) - 6, CH - 8);
        ctx.fillText('핑', L + w - 12, CH - 8);
        if (!H.length) return;

        const series = [['trkN', COL.ntrk], ['det', COL.det], ['clf', COL.clf], ['trkC', COL.trk]];
        const n = H.length;
        for (const [k, col] of series) {
          ctx.strokeStyle = col; ctx.lineWidth = 1.6;
          ctx.beginPath();
          for (let i = 0; i < n - 1; i++) { const x = xOf(i), y = yOf(H[i][k]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
          // 마지막 구간은 애니메이션 진행만큼만 이어 그림
          const x0 = xOf(Math.max(0, n - 2)), y0 = yOf(H[Math.max(0, n - 2)][k]);
          const x1 = xOf(n - 1), y1 = yOf(H[n - 1][k]);
          const xe = x0 + (x1 - x0) * e, ye = y0 + (y1 - y0) * e;
          if (n === 1) ctx.moveTo(xe, ye); else ctx.lineTo(xe, ye);
          ctx.stroke();
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.arc(xe, ye, 3, 0, Math.PI * 2); ctx.fill();
        }
      }

      function summary(key, skipFirst) {
        const arr = S.hist.slice(skipFirst ? 1 : 0).map(o => o[key]);
        if (!arr.length) return ['–', '–', '–'];
        const sum = arr.reduce((a, b) => a + b, 0);
        return [fmt(Math.min(...arr)), fmt(Math.max(...arr)), (sum / arr.length).toFixed(1)];
      }

      function updateStats() {
        const last = S.hist[S.hist.length - 1];
        el('pingNo').textContent = S.ping;
        el('nDet').textContent = last ? `첨두치 ${fmt(last.peaks)}개 중 문턱값 ${last.thr} dB 초과` : '첨두치 추출 후 문턱값 적용';
        el('nClf').textContent = P.classifier.enabled ? '분류기 적용: 비표적으로 판정된 탐지 제거' : '분류기 비활성화 (classifier.enabled = false)';
        const rows = [
          ['탐지', 'det', false],
          ['분류 후', 'clf', false],
          ['궤적 (분류기 적용)', 'trkC', true],
          ['궤적 (분류기 미적용)', 'trkN', true]
        ];
        el('statBody').innerHTML = rows.map(([name, key, skip]) => {
          const [mn, mx, av] = summary(key, skip);
          return `<tr><td>${name}</td><td>${last ? fmt(last[key]) : '–'}</td><td>${mn}</td><td>${mx}</td><td>${av}</td></tr>`;
        }).join('');
        el('kMis').textContent = S.totTarget ? (100 * S.misTarget / S.totTarget).toFixed(1) + '%' : '–';
        el('kRem').textContent = S.totNon ? (100 * S.remNon / S.totNon).toFixed(1) + '%' : '–';

        // 비교 요약 문구
        const h = S.hist.slice(1);
        if (!P.classifier.enabled) {
          el('cmpNote').textContent = '지금은 분류기가 꺼져 있어 두 화면이 같습니다. 실험 설정에서 분류기를 켜 보세요.';
        } else if (h.length) {
          const aC = h.reduce((a, o) => a + o.trkC, 0) / h.length, aN = h.reduce((a, o) => a + o.trkN, 0) / h.length;
          const ratio = aC > 0 ? Math.round(aN / aC) : null;
          el('cmpNote').innerHTML = `지금까지 평균 궤적 수는 분류기 적용 <b>${aC.toFixed(1)}개</b>, 미적용 <b>${aN.toFixed(1)}개</b>입니다.` +
            (ratio ? ` 운용자가 확인해야 할 궤적이 약 <b>${fmt(ratio)}분의 1</b>로 줄었습니다.` : '') +
            ' 비표적이 너무 많으면 추적만으로는 걸러내기 어렵다는 논문의 지적(4.3절)과 같은 결과입니다.';
        } else {
          el('cmpNote').textContent = '두 번째 핑부터 비교 결과가 표시됩니다.';
        }
      }

      // ---------- 재생 제어 ----------
      function interval() { return P.simulation.pingIntervalMs / parseFloat(el('speed').value); }
      function play() {
        if (S.ping >= P.simulation.maxPings) { reset(); step(); }
        playing = true; clearInterval(timer); timer = setInterval(() => step(false), interval());
        el('btnPlay').textContent = '⏸ 일시정지';
      }
      function stop(done) {
        playing = false; clearInterval(timer); timer = null;
        el('btnPlay').textContent = done ? '▶ 다시 재생' : '▶ 재생';
      }

      // ---------- 테마 ----------
      function applyTheme(t) {
        document.documentElement.dataset.theme = t;
        try { localStorage.setItem('sonar-theme', t); } catch (e) { /* 저장 불가 환경은 무시 */ }
        el('btnTheme').textContent = t === 'dark' ? '☀ 라이트 모드' : '🌙 다크 모드';
        readColors();
        colorize(fieldCur, offCur);
        colorize(fieldPrev, offPrev);
        anim.final = false;
      }

      // ---------- 실험 설정 (초기값 = ConfigMap의 params.json) ----------
      const pct = v => (v * 100).toFixed(1).replace(/\.0$/, '') + '%';
      function syncControls() {
        const d = P.detection, c = P.classifier, bd = BASE.detection, bc = BASE.classifier;
        el('sThr').value = d.thresholdDb; el('sPeak').value = d.peakMean; el('sClf').checked = !!c.enabled;
        el('sMis').value = c.targetMisclassRate * 100; el('sRem').value = c.nonTargetRemainRate * 100;
        el('vThr').textContent = d.thresholdDb + ' dB';
        el('vPeak').textContent = fmt(d.peakMean) + '개';
        el('vClf').textContent = c.enabled ? '사용' : '사용 안 함';
        el('vMis').textContent = pct(c.targetMisclassRate);
        el('vRem').textContent = pct(c.nonTargetRemainRate);
        el('dThr').textContent = `ConfigMap 기본 ${bd.thresholdDb} dB · 낮추면 탐지가 늘고 높이면 약한 표적을 놓침`;
        el('dPeak').textContent = `ConfigMap 기본 ${fmt(bd.peakMean)}개 · 잔향·잡음이 많은 해역일수록 큼`;
        el('dClf').textContent = `ConfigMap 기본 ${bc.enabled ? '사용' : '사용 안 함'} · 끄면 기존 다층처리 구조`;
        el('dMis').textContent = `ConfigMap 기본 ${pct(bc.targetMisclassRate)} (논문 평균) · 표적을 비표적으로 잘못 지울 확률`;
        el('dRem').textContent = `ConfigMap 기본 ${pct(bc.nonTargetRemainRate)} (논문 평균) · 비표적이 걸러지지 않고 남을 확률`;
        el('ctlMis').classList.toggle('off', !c.enabled); el('sMis').disabled = !c.enabled;
        el('ctlRem').classList.toggle('off', !c.enabled); el('sRem').disabled = !c.enabled;
        const changed = d.thresholdDb !== bd.thresholdDb || d.peakMean !== bd.peakMean || !!c.enabled !== !!bc.enabled ||
          c.targetMisclassRate !== bc.targetMisclassRate || c.nonTargetRemainRate !== bc.nonTargetRemainRate;
        el('setChip').textContent = changed ? '화면에서 변경됨 (임시)' : 'ConfigMap 기본값 사용 중';
        el('setChip').classList.toggle('changed', changed);
        el('btnDefaults').disabled = !changed;
        updateStats();
      }
      function onSetting() {
        P.detection.thresholdDb = parseFloat(el('sThr').value);
        P.detection.peakMean = parseInt(el('sPeak').value, 10);
        P.classifier.enabled = el('sClf').checked;
        P.classifier.targetMisclassRate = parseFloat(el('sMis').value) / 100;
        P.classifier.nonTargetRemainRate = parseFloat(el('sRem').value) / 100;
        syncControls();
      }
      ['sThr', 'sPeak', 'sMis', 'sRem'].forEach(id => el(id).addEventListener('input', onSetting));
      el('sClf').addEventListener('change', onSetting);
      el('btnDefaults').addEventListener('click', () => {
        P.detection.thresholdDb = BASE.detection.thresholdDb;
        P.detection.peakMean = BASE.detection.peakMean;
        P.classifier = { ...BASE.classifier };
        syncControls();
      });

      // ---------- 탐지 클릭 상세보기 ----------
      // 탐지 위치 중심으로 방위 15 × 거리 25 셀을 잘라 흑백 영상으로 그림 (논문 Fig. 5 형식)
      function drawPatch(canvas, m) {
        const D = P.display, n = D.bearingCells, RC = D.rangeCells;
        const ctx = canvas.getContext('2d'), img = ctx.createImageData(25, 15);
        const cx = Math.round(m.b), cy = Math.round(m.r / D.maxRangeKm * RC);
        for (let i = 0; i < 15; i++) {          // 행: 방위
          for (let j = 0; j < 25; j++) {        // 열: 거리
            const y = cy - 12 + j, x = mod(cx - 7 + i, n);
            const v = y >= 0 && y < RC ? fieldCur[y * n + x] : 0;
            const g = Math.round(255 * clamp01((v - 0.15) / 0.75));
            const o = (i * 25 + j) * 4;
            img.data[o] = img.data[o + 1] = img.data[o + 2] = g; img.data[o + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      }
      function showDetail(m) {
        const F = S.frame, c = P.classifier;
        drawPatch(el('pSel'), m);
        const tgt = F.dets.find(d => d.isTarget);
        el('figTgt').hidden = !tgt || tgt === m;
        if (tgt && tgt !== m) drawPatch(el('pTgt'), tgt);
        let verdict;
        if (!c.enabled) verdict = '<span class="tag na">분류기 꺼짐</span>';
        else if (m.isTarget && m.kept) verdict = '<span class="tag ok">정분류</span> 표적을 표적으로 판정';
        else if (!m.isTarget && !m.kept) verdict = '<span class="tag ok">정분류</span> 비표적을 걸러냄';
        else if (m.isTarget) verdict = '<span class="tag bad">오분류</span> 표적을 비표적으로 잘못 제거 (미탐지)';
        else verdict = '<span class="tag bad">오분류</span> 비표적이 걸러지지 않음 (오경보)';
        el('detailDl').innerHTML =
          `<dt>실제 정체</dt><dd>${m.isTarget ? '<b>표적</b>' : '비표적 (잔향·잡음)'}</dd>` +
          `<dt>분류 결과</dt><dd>${c.enabled ? (m.kept ? '표적으로 판정 → 유지' : '비표적으로 판정 → 제거') : '분류 없이 그대로 추적'}</dd>` +
          `<dt>판정</dt><dd>${verdict}</dd>` +
          `<dt>SNR</dt><dd>${m.snr.toFixed(1)} dB</dd>` +
          `<dt>방위</dt><dd>${m.b.toFixed(1)} beam cell</dd>` +
          `<dt>거리</dt><dd>${m.r.toFixed(2)} km</dd>`;
        el('detailPing').textContent = `핑 ${S.ping}의 탐지`;
        const sec = el('detailSec');
        sec.hidden = false;
        sec.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'nearest' });
      }
      function onScopeClick(idx, ev) {
        const F = S && S.frame;
        if (!F) return;
        const rect = cvs[idx].getBoundingClientRect();
        const x = (ev.clientX - rect.left) / rect.width * LW, y = (ev.clientY - rect.top) / rect.height * LH;
        const sx = LW / P.display.bearingCells, sy = LH / P.display.maxRangeKm;
        let best = null, bd = 12 * 12;
        for (const m of (idx === 0 ? F.dets : F.kept)) {
          const d = (m.b * sx - x) ** 2 + (m.r * sy - y) ** 2;
          if (d < bd) { bd = d; best = m; }
        }
        if (!best) return;
        stop();
        anim = { t0: 0, dur: 0, final: false };   // 진행 중인 애니메이션을 끝내고 전체 화면 표시
        SEL = { m: best, live: true };
        showDetail(best);
      }
      el('cv1').addEventListener('click', ev => onScopeClick(0, ev));
      el('cv2').addEventListener('click', ev => onScopeClick(1, ev));
      el('btnCloseDetail').addEventListener('click', () => { el('detailSec').hidden = true; SEL = null; });
      el('showCmp').addEventListener('change', () => { el('cmpBody').hidden = !el('showCmp').checked; });

      el('btnPlay').addEventListener('click', () => (playing ? stop() : play()));
      el('btnStep').addEventListener('click', () => { stop(); step(true); });
      el('btnReset').addEventListener('click', () => { const was = playing; stop(); reset(); step(true); if (was) play(); });
      el('speed').addEventListener('change', () => { if (playing) play(); });
      el('btnTheme').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
      document.addEventListener('keydown', ev => {
        // 슬라이더·선택상자에서는 방향키를 그대로 쓰고, 체크박스에서는 Space만 원래 동작(체크)으로 둠
        const t = ev.target, tag = t.tagName;
        if (tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'INPUT' && t.type !== 'checkbox')) return;
        if (tag === 'INPUT' && ev.code === 'Space') return;
        if (ev.code === 'Space') { ev.preventDefault(); playing ? stop() : play(); }
        else if (ev.code === 'ArrowRight') { ev.preventDefault(); stop(); step(true); }
      });

      // ---------- 시작: ConfigMap에서 마운트된 params.json 읽기 ----------
      async function init() {
        const src = el('paramSrc');
        try {
          const res = await fetch('params.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const loaded = await res.json();
          P = merge(DEFAULTS, loaded);
          src.textContent = '✓ params.json에서 설정을 불러왔습니다 (ConfigMap sonar-sim-params).';
          src.className = 'src ok';
          el('paramJson').textContent = JSON.stringify(loaded, null, 2);
        } catch (e) {
          P = DEFAULTS;
          src.textContent = '⚠ params.json을 불러오지 못해 내장 기본값을 사용합니다 (' + e.message + ').';
          src.className = 'src fallback';
          el('paramJson').textContent = JSON.stringify(DEFAULTS, null, 2);
        }
        BASE = JSON.parse(JSON.stringify(P));
        P = JSON.parse(JSON.stringify(P));
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
        reset();
        syncControls();
        step(false);
        play();
        requestAnimationFrame(render);
      }
      init();
    })();
    </script>
    </body>
    </html>
