      <section aria-label="설명">
        <h2>각 단계에서 일어나는 일</h2>
        <div class="explain">
          <div class="card">
            <b>① 탐지</b>
            <p>수신 신호에서 국부 최댓값(첨두치)을 뽑고, 주변 잡음 대비 6 dB 이상인 것만 탐지로 남깁니다. 표적은 1개뿐인데 해저·해수면 잔향과 생물 소음 때문에 매 핑 수백 개의 비표적 탐지가 함께 생깁니다.</p>
          </div>
          <div class="card">
            <b>② 분류</b>
            <p>논문은 탐지 주변의 에너지 분포 영상(방위 15 × 거리 25 픽셀)을 CNN으로 분류합니다. 비표적이 표적보다 약 200배 많은 불균형 데이터라서, 비표적을 200개 세트로 나눠 분류기 200개를 학습하고 그중 가장 좋은 것을 골랐습니다. 이 시뮬레이터는 CNN 대신 논문이 보고한 평균 성능(오분류 5.9%, 잔존 5.2%)을 확률로 적용합니다.</p>
          </div>
          <div class="card">
            <b>③ 추적</b>
            <p>방위·방위변화율·거리·거리변화율을 상태로 하는 칼만 필터로 다음 위치를 예측하고, 가장 가까운 탐지와 연계합니다. 연계되면 신뢰도 +0.4, 놓치면 −0.4이며 새 궤적은 0.5에서 시작하고 0이 되면 삭제됩니다. 두 핑 이상 연계된 궤적만 화면에 표시합니다.</p>
