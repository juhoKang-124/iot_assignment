# 시뮬레이터 웹페이지 (src/index.html 내용)
# Deployment에서 /var/www/html/index.html 로 마운트됨
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonar-sim-web
  labels:
    app: sonar-sim
    app.kubernetes.io/part-of: sonar-sim
data:
  index.html: |
    <!doctype html>
    <html lang="ko" data-theme="light">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>능동소나 다층처리 시뮬레이터</title>
    <script>
      // 화면이 그려지기 전에 저장된 테마를 적용 (기본: 라이트)
      try { document.documentElement.dataset.theme = localStorage.getItem('sonar-theme') || 'light'; }
      catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <style>
      :root, :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-2: #eef3f9;
        --line: #dbe3ee;
        --text: #15233a;
        --text-2: #33435c;
        --muted: #5d6d86;
        --accent: #0a7ea4;
        --accent-soft: rgba(10, 126, 164, 0.16);
        --det: #e03131;
        --clf: #0b7285;
        --trk: #2b8a3e;
        --ntrk: #e8590c;
        --warn: #a35f00;
        --truth: #111827;
        --scope-bg: #f7fafd;
        --grid: rgba(21, 35, 58, 0.12);
        --grid-text: rgba(21, 35, 58, 0.62);
        --sweep: 10, 126, 164;
        --code-bg: #f1f5fa;
        --code-text: #1d2b44;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 4px 14px rgba(16, 24, 40, 0.04);
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #070d1a;
        --panel: #0e1729;
        --panel-2: #13203a;
        --line: #22314f;
        --text: #e6edf7;
        --text-2: #c9d5ea;
        --muted: #93a4c3;
        --accent: #4fd1e8;
        --accent-soft: rgba(79, 209, 232, 0.18);
        --det: #ff5a5a;
        --clf: #7fe7ff;
        --trk: #7cf07c;
        --ntrk: #ffb347;
        --warn: #ffd166;
        --truth: #ffffff;
        --scope-bg: #081033;
        --grid: rgba(255, 255, 255, 0.10);
        --grid-text: rgba(230, 237, 247, 0.75);
        --sweep: 79, 209, 232;
        --code-bg: #050a14;
        --code-text: #cfe3ff;
        --shadow: none;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
        line-height: 1.55;
        transition: background-color .25s, color .25s;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 56px; }

      /* 헤더 */
      header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .sonar { position: relative; width: 46px; height: 46px; flex: none; }
      .sonar i { position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: 50%; opacity: 0;
                 animation: ripple 2.4s ease-out infinite; }
      .sonar i:nth-child(2) { animation-delay: .8s; }
      .sonar i:nth-child(3) { animation-delay: 1.6s; }
      .sonar b { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
                 border-radius: 50%; background: var(--accent); }
      @keyframes ripple { 0% { transform: scale(.18); opacity: .95; } 100% { transform: scale(1); opacity: 0; } }
      h1 { font-size: 1.6rem; margin: 0; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin: 2px 0 0; font-size: 0.93rem; }
      .head-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .badge { display: inline-block; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
               border: 1px solid var(--warn); color: var(--warn); white-space: nowrap; }
      h2 { font-size: 1.05rem; margin: 0 0 12px; }
      section { margin-top: 24px; }

      /* 처리 흐름 */
      .pipeline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
      .stage { flex: 1 1 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
               padding: 10px 12px; box-shadow: var(--shadow);
               transition: transform .2s, box-shadow .2s, border-color .2s, background-color .2s; }
      .stage b { display: block; font-size: 0.95rem; }
      .stage span { color: var(--muted); font-size: 0.8rem; }
      .stage.hl b { color: var(--accent); }
      .stage.hl { border-color: var(--accent); }
      .stage.on { transform: translateY(-3px); border-color: var(--accent); background: var(--panel-2);
                  box-shadow: 0 0 0 4px var(--accent-soft); }
      .arrow { align-self: center; color: var(--muted); font-size: 1.2rem; transition: color .2s, transform .2s; }
      .arrow.on { color: var(--accent); transform: translateX(4px); }

      /* 조작부 */
      .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel);
                  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
      button, select { font: inherit; font-size: 0.9rem; color: var(--text); background: var(--panel-2);
                       border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
                       transition: border-color .15s, background-color .15s; }
      button:hover, select:hover { border-color: var(--accent); }
      button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      :root[data-theme="dark"] button.primary { color: #062530; }
      label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
      .ping { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
      .ping b { color: var(--text); font-size: 1.05rem; }
      kbd { font: inherit; font-size: 0.75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
            padding: 0 4px; color: var(--muted); }

      /* 3개 화면 */
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: var(--shadow); }
      .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
      .card-head h3 { margin: 0; font-size: 0.95rem; }
      .count { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .count small { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 2px; }
      canvas.scope { width: 100%; height: auto; display: block; border-radius: 6px; background: var(--scope-bg);
                     border: 1px solid var(--line); }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
      .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
      .note { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

      /* 통계 */
      .stats-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; }
      @media (max-width: 860px) { .stats-grid { grid-template-columns: 1fr; } }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
      th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--muted); font-weight: 500; }
      .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
      .kpi { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
      .kpi span { display: block; color: var(--muted); font-size: 0.78rem; }
      .kpi b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
      .kpi em { font-style: normal; color: var(--muted); font-size: 0.78rem; }
      canvas.chart { width: 100%; height: auto; display: block; }

      /* 설정 및 설명 */
      details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); }
      summary { cursor: pointer; font-weight: 600; }
      pre { overflow-x: auto; font-size: 0.8rem; background: var(--code-bg); border-radius: 8px; padding: 12px; color: var(--code-text); }
      .src { font-size: 0.85rem; margin: 8px 0 0; }
      .src.ok { color: var(--trk); }
      .src.fallback { color: var(--warn); }
      .explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
      .explain p { margin: 6px 0 0; font-size: 0.9rem; color: var(--text-2); }
      footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--muted); }
      footer p { margin: 4px 0; }
      footer a { color: var(--accent); }

      /* 실험 설정 */
      .set-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
      .set-head h2 { margin: 0; }
      .set-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 22px; }
      .ctl { display: flex; flex-direction: column; gap: 4px; transition: opacity .2s; }
      .ctl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.88rem; }
      .ctl-top b { font-variant-numeric: tabular-nums; color: var(--accent); }
      .ctl small { color: var(--muted); font-size: 0.75rem; }
      .ctl.off { opacity: .45; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .chip { font-size: 0.78rem; padding: 2px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted);
              border: 1px solid var(--line); white-space: nowrap; }
      .chip.changed { color: var(--warn); border-color: var(--warn); }

      /* 클릭 가능한 화면 */
      canvas.clickable { cursor: crosshair; }
      .hint { font-size: 0.82rem; color: var(--accent); margin: 6px 0 0; }

      /* 탐지 상세 */
      .detail { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
      @media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
      .patches { display: flex; flex-wrap: wrap; gap: 12px; }
      .patches figure { margin: 0; }
      canvas.patch { width: 250px; max-width: 100%; height: auto; aspect-ratio: 25 / 15; image-rendering: pixelated;
                     border-radius: 6px; border: 1px solid var(--line); background: #000; display: block; }
      figcaption { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
      .dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 0.9rem; margin: 0; }
      .dl dt { color: var(--muted); }
      .dl dd { margin: 0; font-variant-numeric: tabular-nums; }
      .tag { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; border: 1px solid; }
      .tag.ok { color: var(--trk); }
      .tag.bad { color: var(--det); }
      .tag.na { color: var(--muted); }
      .detail-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 10px; }

      /* 비교 */
      .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
      .cmp-note { font-size: 0.92rem; margin: 10px 0 0; color: var(--text-2); }
      .cmp-note b { color: var(--accent); }

      @media (prefers-reduced-motion: reduce) {
        .sonar i { animation: none; opacity: .35; }
        .stage, .arrow, body { transition: none; }
      }
    </style>
    </head>
    <body>
    <div class="wrap">

      <header>
        <div class="brand">
          <div class="sonar" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
          <div>
            <h1>능동소나 다층처리 시뮬레이터</h1>
            <p class="sub">Active Sonar Multi-layer Processing Simulator · 탐지 → 분류 → 추적</p>
          </div>
        </div>
        <div class="head-right">
          <span class="badge">합성 데이터 시연 · 실제 소나 데이터 아님</span>
          <button id="btnTheme" type="button" aria-label="테마 전환">🌙 다크 모드</button>
        </div>
      </header>

      <section aria-label="처리 흐름">
        <div class="pipeline">
          <div class="stage" id="st0"><b>송수신 · 빔형성</b><span>128개 방위 빔, 정합처리, 규준화</span></div>
          <div class="arrow" id="ar1">→</div>
          <div class="stage" id="st1"><b>① 탐지 (Detection)</b><span>첨두치 추출 후 문턱값 적용</span></div>
          <div class="arrow" id="ar2">→</div>
          <div class="stage hl" id="st2"><b>② 분류 (Classification)</b><span>표적/비표적 분류기 (논문의 제안 단계)</span></div>
          <div class="arrow" id="ar3">→</div>
          <div class="stage" id="st3"><b>③ 추적 (Track Management)</b><span>칼만 필터 + 최근접 연계 + 신뢰도 관리</span></div>
        </div>
      </section>

      <section aria-label="조작">
        <div class="controls">
          <button id="btnPlay" class="primary" type="button">⏸ 일시정지</button>
          <button id="btnStep" type="button">한 핑 진행</button>
          <button id="btnReset" type="button">처음부터</button>
          <select id="speed" aria-label="재생 속도">
            <option value="0.5">0.5배속</option>
            <option value="1" selected>1배속</option>
            <option value="2">2배속</option>
            <option value="4">4배속</option>
          </select>
          <label class="chk"><input type="checkbox" id="showTruth" checked> 실제 표적 위치 표시</label>
          <span class="note" style="margin:0"><kbd>Space</kbd> 재생/정지 · <kbd>→</kbd> 한 핑</span>
          <div class="ping">핑 <b id="pingNo">0</b> / <span id="pingMax">0</span></div>
        </div>
      </section>

      <section aria-label="실험 설정">
        <div class="card">
          <div class="set-head">
            <h2>⚙ 실험 설정</h2>
            <div class="set-actions">
              <span class="chip" id="setChip">ConfigMap 기본값 사용 중</span>
              <button id="btnDefaults" type="button">ConfigMap 기본값으로</button>
            </div>
          </div>
          <div class="settings">
            <div class="ctl">
              <div class="ctl-top"><label for="sThr">탐지 문턱값</label><b id="vThr"></b></div>
              <input type="range" id="sThr" min="3" max="12" step="0.5">
              <small id="dThr"></small>
            </div>
            <div class="ctl">
              <div class="ctl-top"><label for="sPeak">클러터 양</label><b id="vPeak"></b></div>
              <input type="range" id="sPeak" min="500" max="4000" step="100">
              <small id="dPeak"></small>
            </div>
            <div class="ctl">
              <div class="ctl-top"><span>분류기 사용</span><b id="vClf"></b></div>
              <label class="chk" style="padding:4px 0"><input type="checkbox" id="sClf"> 탐지와 추적 사이에 분류 단계 넣기</label>
              <small id="dClf"></small>
            </div>
            <div class="ctl" id="ctlMis">
              <div class="ctl-top"><label for="sMis">표적 오분류율</label><b id="vMis"></b></div>
              <input type="range" id="sMis" min="0" max="30" step="0.5">
              <small id="dMis"></small>
            </div>
            <div class="ctl" id="ctlRem">
              <div class="ctl-top"><label for="sRem">비표적 잔존율</label><b id="vRem"></b></div>
              <input type="range" id="sRem" min="0" max="30" step="0.5">
              <small id="dRem"></small>
            </div>
          </div>
          <p class="note">변경은 다음 핑부터 적용됩니다. 통계를 새로 보려면 "처음부터"를 누르세요. 화면에서 바꾼 값은 임시 실험용이며, 페이지를 새로고침하면 ConfigMap(params.json) 값으로 돌아갑니다.</p>
        </div>
      </section>

      <section aria-label="처리 단계별 화면">
        <div class="panels">
          <div class="card">
            <div class="card-head"><h3>① 탐지 결과</h3><div class="count" id="cDet">0<small>개</small></div></div>
            <canvas class="scope clickable" id="cv1" width="384" height="360"></canvas>
            <div class="legend"><span><i class="sw" style="background:var(--det)"></i>문턱값 초과 탐지</span><span><i class="sw" style="background:var(--truth)"></i>실제 표적</span></div>
            <div class="note" id="nDet">첨두치 0개 중 문턱값 초과</div>
          </div>
          <div class="card">
            <div class="card-head"><h3>② 분류 결과</h3><div class="count" id="cClf">0<small>개</small></div></div>
            <canvas class="scope clickable" id="cv2" width="384" height="360"></canvas>
            <div class="legend"><span><i class="sw" style="background:var(--clf)"></i>표적으로 분류되어 남은 탐지</span><span><i class="sw" style="background:var(--det);opacity:.5"></i>제거되는 비표적</span></div>
            <div class="note" id="nClf">분류기 적용</div>
          </div>
          <div class="card">
            <div class="card-head"><h3>③ 추적 결과</h3><div class="count" id="cTrk">0<small>개 궤적</small></div></div>
            <canvas class="scope" id="cv3" width="384" height="360"></canvas>
            <div class="legend"><span><i class="sw" style="background:var(--trk)"></i>표적 궤적</span><span><i class="sw" style="background:var(--ntrk)"></i>비표적 궤적</span></div>
            <div class="note">분류기 없이 탐지 결과를 바로 추적하면 <b id="cTrkN">0</b>개 궤적</div>
          </div>
        </div>
        <p class="note">가로축: 방위(beam cell, 0–128) · 세로축: 거리(0–10 km). 위에서 아래로 내려가는 선은 반향음이 거리 순서대로 돌아오는 것을 나타냅니다. 화면 배치는 논문 Fig. 11, 12, 14를 참고했습니다.</p>
        <p class="hint">👆 ① 또는 ② 화면의 탐지를 클릭하면 재생이 멈추고 아래에 상세 정보가 나타납니다.</p>
      </section>

      <section id="detailSec" aria-label="탐지 상세" hidden>
        <h2>탐지 상세 정보</h2>
        <div class="card detail">
          <div class="patches">
            <figure>
              <canvas class="patch" id="pSel" width="25" height="15"></canvas>
              <figcaption>선택한 탐지의 에너지 분포 영상</figcaption>
            </figure>
            <figure id="figTgt">
              <canvas class="patch" id="pTgt" width="25" height="15"></canvas>
              <figcaption>같은 핑의 실제 표적 (비교용)</figcaption>
            </figure>
          </div>
          <div>
            <dl class="dl" id="detailDl"></dl>
            <p class="note">영상은 탐지 위치를 중심으로 방위 15셀(세로) × 거리 25셀(가로)을 잘라 흑백으로 표시한 것으로, 논문 Fig. 5와 같은 형식입니다. 논문의 CNN은 이 영상을 입력으로 받아 표적과 비표적을 구분합니다. 표적은 센서 배열의 방위 특성과 송신 펄스 길이 때문에 일정한 크기로 퍼져 보이고, 비표적은 중심에만 작게 몰리거나 모양이 불규칙합니다.</p>
            <div class="detail-foot">
              <span class="note" id="detailPing"></span>
              <button id="btnCloseDetail" type="button">닫기</button>
            </div>
          </div>
        </div>
      </section>

      <section aria-label="분류기 효과 비교">
        <div class="set-head">
          <h2>분류기 효과 비교 · 추적 결과</h2>
          <label class="chk"><input type="checkbox" id="showCmp" checked> 비교 화면 보기</label>
        </div>
        <div id="cmpBody">
          <div class="compare">
            <div class="card">
              <div class="card-head"><h3>분류기 적용 (논문 제안 구조)</h3><div class="count" id="cmpC">0<small>개 궤적</small></div></div>
              <canvas class="scope" id="cv4" width="384" height="360"></canvas>
            </div>
            <div class="card">
              <div class="card-head"><h3>분류기 미적용 (기존 구조)</h3><div class="count" id="cmpN">0<small>개 궤적</small></div></div>
              <canvas class="scope" id="cv5" width="384" height="360"></canvas>
            </div>
          </div>
          <p class="cmp-note" id="cmpNote"></p>
        </div>
      </section>

      <section aria-label="통계">
        <h2>단계별 개수 통계</h2>
        <div class="stats-grid">
          <div class="card">
            <table>
              <thead><tr><th>구분</th><th>현재</th><th>최소</th><th>최대</th><th>평균</th></tr></thead>
              <tbody id="statBody"></tbody>
            </table>
            <div class="kpis">
              <div class="kpi"><span>표적 오분류율 (관측)</span><b id="kMis">–</b> <em>논문 평균 5.9%</em></div>
              <div class="kpi"><span>비표적 잔존율 (관측)</span><b id="kRem">–</b> <em>논문 평균 5.2%</em></div>
            </div>
            <p class="note">궤적 수는 궤적 생성에 두 핑이 필요하므로 첫 핑을 제외하고 집계합니다 (논문 4.3절).</p>
          </div>
          <div class="card">
            <canvas class="chart" id="chart" width="720" height="260"></canvas>
            <div class="legend">
              <span><i class="sw" style="background:var(--det)"></i>탐지</span>
              <span><i class="sw" style="background:var(--clf)"></i>분류 후</span>
              <span><i class="sw" style="background:var(--trk)"></i>궤적 (분류기 적용)</span>
              <span><i class="sw" style="background:var(--ntrk)"></i>궤적 (분류기 미적용)</span>
            </div>
            <p class="note">세로축은 로그 눈금입니다. 분류기 미적용 궤적 수는 탐지 수와 거의 겹칩니다.</p>
          </div>
