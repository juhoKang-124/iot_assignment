# 클러스터 내부에서 Pod에 접근하는 고정 주소
# selector(app: sonar-sim)가 Deployment의 Pod label과 일치해야 연결됨
apiVersion: v1
kind: Service
metadata:
  name: sonar-sim
  labels:
    app: sonar-sim
    app.kubernetes.io/part-of: sonar-sim
spec:
  selector:
    app: sonar-sim
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
